<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ristorante Rossini</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f7f3ef;color:#222}
    header{background:#111;color:#fff;padding:24px;text-align:center}
    .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:20px}
    .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
    img{width:100%;height:180px;object-fit:cover}
    .content{padding:14px}
    .price{font-weight:bold;color:#b33}
  </style>
</head>
<body>
<header>
  <h1>Ristorante Rossini</h1>
  <p>Live menu powered by GitHub Pages + Firebase</p>
</header>

<section class="menu">
  <div class="card">
    <img loading="lazy" src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800&q=70&fm=webp" alt="Pizza">
    <div class="content"><h3>Margherita Pizza</h3><p class="price">€12</p></div>
  </div>
  <div class="card">
    <img loading="lazy" src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=800&q=70&fm=webp" alt="Pasta">
    <div class="content"><h3>Creamy Pasta</h3><p class="price">€14</p></div>
  </div>
  <div class="card">
    <img loading="lazy" src="https://images.unsplash.com/photo-1559847844-5315695dadae?w=800&q=70&fm=webp" alt="Burger">
    <div class="content"><h3>Beef Burger</h3><p class="price">€11</p></div>
  </div>
</section>
</body>
</html>
